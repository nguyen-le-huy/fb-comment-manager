version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: fb-comment-frontend-dev
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      # Optional environment overrides if needed
      - NODE_ENV=development

  backend:
    build:
      context: ./backend
      target: development
    container_name: fb-comment-backend-dev
    command: npm run start:dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
